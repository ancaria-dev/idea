# Every string a person reads. Keys are grouped by where they appear.
#
# Anything with a {0} in it goes through MessageFormat, where a single quote is
# an escape character. There are none in the parameterised lines below, and if
# one is ever needed it has to be doubled.

# --- New Project | Sacred Mod --------------------------------------------
wizard.name=Sacred Mod
wizard.subtitle=Create a Sacred Gold mod with Gradle
wizard.group=Group:
wizard.mod.name=Mod name:
wizard.mod.name.comment=Name shown in the launcher
wizard.mod.id=Mod ID:
wizard.mod.id.comment=Lowercase letters, digits, and hyphens. The launcher stores this ID in its enabled-mod list, so don’t change it after release.
wizard.description=Description:
wizard.description.default={0}, a mod for Sacred Gold
wizard.template=Template:
wizard.template.comment=Initial entrypoint content
wizard.language=Language:
wizard.language.comment=Language used for the mod. Kotlin and Groovy add their runtimes to the JAR. Java doesn’t.
wizard.dsl=Build script:
wizard.dsl.comment=Language used for the Gradle build script. It doesn’t have to match the mod language.
wizard.git=Create a Git repository
wizard.git.comment=Initializes a Git repository and adds the repository URL as origin. Doesn’t create a commit.
wizard.srml=Create an SRML mod repository
wizard.srml.comment=Adds the three files that make the project installable from a launcher, not just buildable
wizard.srml.files=<b>registry.toml</b> — the mod’s repository entry. <code>coderpack index</code> turns it and the built JAR into the file a launcher reads.<br><b>.github/workflows/build.yml</b> — builds the mod on every push and publishes a release when its version changes.<br><b>dependencies.json</b> — pins the coderpack version that workflow downloads, so a release elsewhere can’t change what your build does.
wizard.repository=Repository URL:
wizard.repository.comment=Where the project will be hosted. registry.toml uses this URL to build download links.
wizard.advanced=Advanced
wizard.package=Package:
wizard.author=Author:
wizard.version=Mod version:
wizard.site=ancaria.dev
wizard.error.blank=This cannot be empty
wizard.failed=Sacred Mod project

