org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# No configuration cache here, unlike the sibling repositories. The IntelliJ
# Platform Gradle Plugin resolves and unpacks a whole IDE during configuration,
# and turning it on buys a second or two on a build whose slowest task starts a
# second IDE.

group=dev.ancaria

# What CI reads to decide whether this build is a release. A push that does not
# change this number publishes nothing, here or on the marketplace.
pluginVersion=0.1.0

# The IDE this plugin is compiled against, and the range it tells the
# marketplace it works in. Compiled against the oldest supported build on
# purpose: the other way round compiles happily against an API that is not in
# the IDE half the users are running, and nothing says so until they install it.
platformVersion=2025.2.6
sinceBuild=252
untilBuild=253.*

# The IDE hands a plugin the Kotlin standard library it was built with, so a
# second copy in the plugin's own lib/ is a second kotlin.jvm.internal.Intrinsics
# on the classpath. See languageVersion in build.gradle.kts for the other half
# of this.
kotlin.stdlib.default.dependency=false
